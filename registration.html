<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <button style="background-color: #4CAF50;  cursor: pointer;" onclick="window.location.href='index.html'">Home</button>
    <button style="background-color: #4CAF50;  cursor: pointer;" onclick="window.location.href='registration.html'">Registration</button>
    <button style="background-color: #4CAF50;  cursor: pointer;" onclick="window.location.href='events.html'">Events</button>
    <h1>Registration</h1>
    <p>Please fill out the form below to register for our college programs.</p>
    <form action="name">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        <label for="event">interest in events:</label>
        <select id="event" name="event">
            <option value="a">Annual Sports Meet</option>
            <option value="b">Tech Fest 2026</option>
            <option value="c">Cultural Night</option>
        </select><br><br>
        <input type="submit" value="Register">
    </form>
</body>
</html>
